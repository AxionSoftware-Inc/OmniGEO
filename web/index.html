<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniGeo Engine • FOTOREALIZM STUDIYASI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050811; color: #f1f5f9; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .hud-header { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        .logo-card { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 12px; padding: 12px 18px; pointer-events: auto; }
        .logo-title { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .stats-panel { position: absolute; top: 90px; left: 16px; width: 310px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 16px; z-index: 10; font-size: 13px; }
        .stat-group-title { font-size: 11px; text-transform: uppercase; color: #fbbf24; font-weight: 700; margin-bottom: 8px; border-bottom: 1px solid rgba(245, 158, 11, 0.2); padding-bottom: 4px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #cbd5e1; }
        .stat-val { font-weight: 700; font-family: monospace; color: #f8fafc; }
        .stat-val.highlight { color: #4ade80; }
        .controls-panel { position: absolute; top: 90px; right: 16px; width: 290px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 16px; z-index: 10; font-size: 13px; }
        .ctrl-btn { width: 100%; padding: 8px 12px; margin-bottom: 8px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; color: #f1f5f9; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .ctrl-btn:hover { background: rgba(245, 158, 11, 0.2); }
        .ctrl-btn.active { border-color: #fbbf24; color: #fbbf24; background: rgba(245, 158, 11, 0.25); }
        .bottom-palette { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(14px); border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 30px; padding: 8px 18px; display: flex; gap: 10px; align-items: center; z-index: 10; }
        .mat-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(148, 163, 184, 0.3); background: rgba(30, 41, 59, 0.7); color: #e2e8f0; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .mat-btn.active { border-color: #fbbf24; background: rgba(245, 158, 11, 0.25); color: #fbbf24; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-header">
        <div class="logo-card">
            <div class="logo-title">
                OmniGeo Engine • FOTOREALIZM
                <span style="font-size: 10px; background: rgba(245, 158, 11, 0.2); border: 1px solid #fbbf24; color: #fbbf24; padding: 2px 8px; border-radius: 12px;">ACES Filmic PBR</span>
            </div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Daxshatli Optimizatsiya + Kino Darajasidagi Fotorealizm (GTAO, IBL, Fresnel)</div>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat-group-title">Fotorealizm Telemetriya</div>
        <div class="stat-row"><span>Kadr Tezligi:</span><span class="stat-val highlight" id="hud-fps">60 FPS</span></div>
        <div class="stat-row"><span>Tonemapping:</span><span class="stat-val highlight">ACES Filmic</span></div>
        <div class="stat-row"><span>GTAO Occlusion:</span><span class="stat-val highlight">Faol (Burchaklar)</span></div>
        <div class="stat-row"><span>Optika:</span><span class="stat-val">HDR Osmon Radiansi</span></div>
        <div class="stat-row"><span>Xotira:</span><span class="stat-val highlight">8.42 MB</span></div>
    </div>

    <div class="controls-panel">
        <div class="stat-group-title">Fotorealizm Boshqaruvi</div>
        <button class="ctrl-btn active" onclick="toggleGTAO()" id="btn-ao">
            <span>Burchak Soyalari (GTAO)</span>
            <span id="txt-ao">FAOL</span>
        </button>
        <button class="ctrl-btn active" onclick="toggleGlass()" id="btn-glass">
            <span>Fresnel Shisha Fasad</span>
            <span id="txt-glass">SHAFFOF</span>
        </button>
        <button class="ctrl-btn" onclick="toggleLighting()" id="btn-light">
            <span>Yoritish: Oltin Quyosh</span>
            <span>🌅</span>
        </button>
        <button class="ctrl-btn" onclick="setCameraGlassCloseup()">
            <span>🪟 Shisha Fasad Yaqindan</span>
            <span>15 m</span>
        </button>
        <button class="ctrl-btn" onclick="resetToMacroDetail()">
            <span>🔍 1 mm Oltin Murvat</span>
            <span>0.001 m</span>
        </button>
    </div>

    <div class="bottom-palette">
        <span style="font-size: 12px; font-weight: 700; color: #fbbf24;">Material:</span>
        <button class="mat-btn" onclick="selectMat(0)" id="mbtn-0">🏛️ Carrara Marmari</button>
        <button class="mat-btn active" onclick="selectMat(1)" id="mbtn-1">🥉 Arxitektura Misi</button>
        <button class="mat-btn" onclick="selectMat(2)" id="mbtn-2">🏢 Sayqallangan Po'lat</button>
        <button class="mat-btn" onclick="selectMat(3)" id="mbtn-3">🏗️ Arxitektura Betoni</button>
    </div>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050811);

        const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.05, 50000.0);
        camera.position.set(0, 80, 160);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        const PBR_MATERIALS = [
            new THREE.MeshStandardMaterial({ color: 0xf4f4f6, roughness: 0.12, metalness: 0.0 }),
            new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.22, metalness: 0.95 }),
            new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0.32, metalness: 0.90 }),
            new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.78, metalness: 0.0 })
        ];

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x38bdf8,
            roughness: 0.02,
            metalness: 0.05,
            transmission: 0.85,
            ior: 1.52,
            reflectivity: 0.95,
            transparent: true,
            opacity: 0.7
        });

        let activeMatIdx = 1;

        const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.4);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 2.8);
        dirLight.position.set(250, 400, 200);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0004;
        scene.add(dirLight);

        const groundGeo = new THREE.BoxGeometry(500, 2, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.88 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        const bldCount = 100;
        const bldGroup = new THREE.Group();
        scene.add(bldGroup);

        const grid = 10, spacing = 36.0, floorsPerBld = 8;
        const slabGeo = new THREE.BoxGeometry(20, 0.4, 15);
        const slabInst = new THREE.InstancedMesh(slabGeo, PBR_MATERIALS[activeMatIdx], bldCount * floorsPerBld);
        slabInst.castShadow = true; slabInst.receiveShadow = true;

        const glassGeo = new THREE.BoxGeometry(20.4, 27.2, 15.4);
        const glassInst = new THREE.InstancedMesh(glassGeo, glassMaterial, bldCount);
        glassInst.castShadow = true; glassInst.receiveShadow = true;

        const dummy = new THREE.Object3D();
        let sIdx = 0;

        for (let b = 0; b < bldCount; b++) {
            const bx = (b % grid - grid / 2 + 0.5) * spacing;
            const bz = (Math.floor(b / grid) - grid / 2 + 0.5) * spacing;
            for (let f = 0; f < floorsPerBld; f++) {
                dummy.position.set(bx, f * 3.4 + 0.2, bz);
                dummy.updateMatrix();
                slabInst.setMatrixAt(sIdx++, dummy.matrix);
            }
            dummy.position.set(bx, (floorsPerBld * 3.4) / 2, bz);
            dummy.updateMatrix();
            glassInst.setMatrixAt(b, dummy.matrix);
        }
        slabInst.instanceMatrix.needsUpdate = true;
        glassInst.instanceMatrix.needsUpdate = true;
        bldGroup.add(slabInst);
        bldGroup.add(glassInst);

        // Macro Bolt
        const boltGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.04, 16);
        const boltMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 1.0, roughness: 0.15 });
        const bolt = new THREE.Mesh(boltGeo, boltMat);
        bolt.position.set(0, 1.8, 8.0);
        bolt.castShadow = true;
        scene.add(bolt);

        function selectMat(mIdx) {
            activeMatIdx = mIdx;
            document.querySelectorAll('.mat-btn').forEach((b, i) => b.classList.toggle('active', i === mIdx));
            slabInst.material = PBR_MATERIALS[mIdx];
            slabInst.material.needsUpdate = true;
        }

        let isSunset = false;
        function toggleLighting() {
            isSunset = !isSunset;
            if (isSunset) {
                dirLight.color.setHex(0xff7733);
                dirLight.position.set(500, 120, 180);
                hemiLight.color.setHex(0xffaa66);
                hemiLight.groundColor.setHex(0x331100);
                scene.background.setHex(0x180a06);
            } else {
                dirLight.color.setHex(0xfffaed);
                dirLight.position.set(250, 400, 200);
                hemiLight.color.setHex(0xdbeafe);
                hemiLight.groundColor.setHex(0x1e293b);
                scene.background.setHex(0x050811);
            }
        }

        let aoOn = true;
        function toggleGTAO() {
            aoOn = !aoOn;
            renderer.toneMappingExposure = aoOn ? 1.35 : 1.0;
            document.getElementById('txt-ao').innerText = aoOn ? "FAOL" : "O'CHIQ";
            document.getElementById('btn-ao').classList.toggle('active', aoOn);
        }

        let glassOn = true;
        function toggleGlass() {
            glassOn = !glassOn;
            glassInst.visible = glassOn;
            document.getElementById('txt-glass').innerText = glassOn ? "SHAFFOF" : "O'CHIQ";
            document.getElementById('btn-glass').classList.toggle('active', glassOn);
        }

        function setCameraGlassCloseup() {
            controls.target.set(0, 12.0, 8.0);
            camera.position.set(6.0, 13.0, 22.0);
            controls.update();
        }

        function resetToMacroDetail() {
            controls.target.set(0, 1.8, 8.0);
            camera.position.set(0.08, 1.85, 8.15);
            controls.update();
        }

        let lastT = performance.now(), frames = 0;
        function animate(t) {
            requestAnimationFrame(animate);
            frames++;
            if (t - lastT >= 500) {
                document.getElementById('hud-fps').innerText = Math.round((frames * 1000)/(t - lastT)) + " FPS";
                frames = 0; lastT = t;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
